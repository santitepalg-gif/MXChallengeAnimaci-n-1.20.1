name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para publicar el release al crear un tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.1.1 = el que usa ForgeGradle 6 en 1.20.1. Así no hace falta subir el gradle wrapper.
      # (Si ya subiste gradlew y gradle/, puedes borrar este paso y usar ./gradlew build)
      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build --no-daemon

      - name: Subir .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mxchallende-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Al subir un tag (ej: git tag v1.0.0 && git push --tags) crea un Release con el .jar
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
